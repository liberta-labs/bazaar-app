<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="description" content="Trade perpetual futures and insure markets on Bazaar." />
    <!-- Link previews (X, Telegram, Discord, Slack...): public/og-image.png, 1200x630, the logo banner on a
         card of the same yellow. Full addresses, since those sites don't resolve relative ones; bump the ?v=
         when the image changes, since they cache it by its address. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bazaar" />
    <meta property="og:title" content="Bazaar App" />
    <meta property="og:description" content="Trade perpetual futures and insure markets on Bazaar." />
    <meta property="og:image" content="https://app.bazaar.finance/og-image.png?v=20261115" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Bazaar logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://app.bazaar.finance/og-image.png?v=20261115" />
    <link rel="icon" type="image/png" href="./bazaar-icon.png" />
    <link rel="apple-touch-icon" href="./bazaar-icon.png" />
    <title>Bazaar App</title>
    <script>
      // Apply the saved theme before the first paint, so the page never flashes the other one: dark unless
      // the user chose light, or chose to follow the system (state/theme.tsx).
      (function () {
        var t = null;
        try { t = localStorage.getItem("bazaar.theme"); } catch (e) {}
        if (t === "system") t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        if (t !== "light") t = "dark";
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
