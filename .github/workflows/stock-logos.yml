# Once a day, download Logo.dev logos for stock markets listed since the last run, commit them to main and
# deploy. A day with nothing new changes nothing. See scripts/fetch-stock-logos.mjs for what it fetches and
# what it costs: on Logo.dev's free plan, about 250 logos a month, far more than get listed.
#
# Needs, in the repository's settings:
#   secrets   LOGO_DEV_SECRET_KEY   Logo.dev's secret key (sk_…); it goes only to api.logo.dev
# and main must accept pushes from GitHub Actions (no rule that requires a pull request for them).
#
# A push made with the workflow's own token doesn't start other workflows, so this starts Deploy itself.

name: Stock logos

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: stock-logos
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  logos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require the Logo.dev key
        env:
          LOGO_DEV_SECRET_KEY: ${{ secrets.LOGO_DEV_SECRET_KEY }}
        run: |
          if [ -z "$LOGO_DEV_SECRET_KEY" ]; then
            echo "::error::The repository secret LOGO_DEV_SECRET_KEY is not set. Add Logo.dev's secret key (sk_…) under Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi

      - name: Check out the app
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: bazaar-app
          ref: main

      - name: Check out the SDK beside it
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: liberta-labs/bazaar-sdk
          ref: main
          path: bazaar-sdk

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            bazaar-app/package-lock.json
            bazaar-sdk/package-lock.json

      - name: Build the SDK
        working-directory: bazaar-sdk
        run: |
          npm ci --ignore-scripts
          npx tsc -b packages/sdk

      - name: Install the app
        working-directory: bazaar-app
        run: npm ci

      - name: Download logos for newly listed stocks
        working-directory: bazaar-app
        env:
          LOGO_DEV_SECRET_KEY: ${{ secrets.LOGO_DEV_SECRET_KEY }}
        run: npm run logos

      - name: Commit them to main
        id: commit
        working-directory: bazaar-app
        run: |
          git add -A -- public src/lib/stockLogoFiles.ts scripts/logo-misses.json
          if git diff --cached --quiet; then
            echo "No new logos."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Download logos for newly listed stock markets"
          # Someone may have pushed while this ran.
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy them
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
