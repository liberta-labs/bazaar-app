# Build the app and deploy it to Cloudflare Pages (project "bazaar-app") on every push to main.
#
# The Pages project takes direct uploads, so this deploys with wrangler. The app takes the SDK from a
# sibling checkout (file:../bazaar-sdk/packages/sdk), so both repositories are checked out side by side.
# Before it deploys, browser smoke tests (Playwright, e2e/) open each page of the build; a failure stops it.
#
# Needs, in the repository's settings:
#   secrets   CLOUDFLARE_API_TOKEN   an API token with Cloudflare Pages: Edit
#             CLOUDFLARE_ACCOUNT_ID  the Cloudflare account the project is in
#   variables VITE_REOWN_PROJECT_ID  the Reown (WalletConnect) project ID; public, it ships in the bundle
# VITE_SERVICE_URL comes from .env.production in the repository.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the app
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: bazaar-app

      - name: Check out the SDK beside it
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: liberta-labs/bazaar-sdk
          ref: main
          path: bazaar-sdk

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            bazaar-app/package-lock.json
            bazaar-sdk/package-lock.json

      - name: Require the Reown project ID
        env:
          VITE_REOWN_PROJECT_ID: ${{ vars.VITE_REOWN_PROJECT_ID }}
        run: |
          if [ -z "$VITE_REOWN_PROJECT_ID" ]; then
            echo "::error::The repository variable VITE_REOWN_PROJECT_ID is not set. Without it, phone wallets (WalletConnect) cannot connect. Add it under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

      - name: Build the SDK
        working-directory: bazaar-sdk
        run: |
          npm ci --ignore-scripts
          npx tsc -b packages/sdk

      - name: Install the app
        working-directory: bazaar-app
        run: npm ci

      - name: Typecheck
        working-directory: bazaar-app
        run: npm run typecheck

      - name: Lint
        working-directory: bazaar-app
        run: npm run lint

      - name: Test
        working-directory: bazaar-app
        run: npm test

      - name: Build
        working-directory: bazaar-app
        env:
          VITE_REOWN_PROJECT_ID: ${{ vars.VITE_REOWN_PROJECT_ID }}
        run: npm run build

      # Each page of the build, served with vite preview, renders in Chromium with no wallet connected.
      - name: Install Chromium for the browser tests
        working-directory: bazaar-app
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        timeout-minutes: 10
        working-directory: bazaar-app
        run: npm run e2e

      - name: Keep the browser tests' traces and screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-results
          path: bazaar-app/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: bazaar-app
          command: pages deploy dist --project-name bazaar-app --branch main
